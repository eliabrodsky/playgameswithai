openapi: 3.0.0
info:
  title: Medicaid Outreach API
  version: '0.1.0'
paths:
  /patients:
    get:
      summary: List patients
      responses:
        '200':
          description: A list of patients
    post:
      summary: Create patient
      responses:
        '200':
          description: Created patient
  /patients/{patient_id}:
    get:
      summary: Get patient
      parameters:
        - in: path
          name: patient_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Patient
        '404':
          description: Not found
    put:
      summary: Update patient
      parameters:
        - in: path
          name: patient_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated patient
    delete:
      summary: Delete patient
      parameters:
        - in: path
          name: patient_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
components:
  schemas:
    Patient:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        dob:
          type: string
          format: date
        last4_ssn:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        consent_contact:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [first_name, last_name, dob]
